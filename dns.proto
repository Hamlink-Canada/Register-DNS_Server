syntax = "proto3";
package apprpt.dns;
import "google/protobuf/timestamp.proto";


message update {
    // Google protobuf Timestamp message
    // Time the new entry was added
    google.protobuf.Timestamp timestamp = 1;

    // The APP RPT Node ID
    int64 node = 2;

    // The Node IP address
    string ipaddress = 3;

    // The Node Port
    int32 port = 4;

    // The TTL for the entry, in seconds
    int32 ttl = 5;

    // String identifying what server added the entry
    string server = 6;
}
